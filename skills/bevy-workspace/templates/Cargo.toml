[workspace]
resolver = "3"
members = ["crates/*", "apps/*"] # Add tools/* when its first package exists.
exclude = ["docs"]

# Architecture lints, built by `just lint-arch` with the nightly pinned in that repository.
[workspace.metadata.dylint]
libraries = [
    { git = "https://github.com/pengwin/rust_dylints", tag = "v0.0.1", pattern = ["lints/rust_layout", "lints/rust_testing", "lints/bevy_layout"] },
]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

rust_2018_idioms = { level = "deny", priority = -1 } # set priority to not interfere with unsafe_code
rust_2024_compatibility = { level = "deny", priority = -1 }

[workspace.lints.clippy]
cargo = { level = "deny", priority = -1 }
all = "deny"
pedantic = "deny"
nursery = "deny"
multiple_crate_versions = { level = "allow", priority = 1 }
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98.1"
authors = ["Ivan Kruchkov <820839+pengwin@users.noreply.github.com>"]
publish = false
license-file = "LICENSE"
repository = __REPOSITORY_TOML__


[workspace.dependencies]
# Declare shared dependencies here; inherit with dependency.workspace = true.
bevy = { version = "0.19", default-features = false, features = ["bevy_asset", "bevy_scene"] }
rstest = "0.26"
game-core = { path = "crates/game-core" }
game-spin = { path = "crates/game-spin" }
